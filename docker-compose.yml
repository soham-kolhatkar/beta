services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: geoattend
      POSTGRES_PASSWORD: geoattend
      POSTGRES_DB: geoattend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoattend -d geoattend"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 7: backs rate limiting (fastapi-limiter) instead of Arcjet — see
  # PROGRESS.md for why. No persistence needed; counters are short-lived.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
